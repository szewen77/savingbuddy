spring:
  application:
    name: savingbuddy-api

  datasource:
    # Absolute path under the user's home. A relative path would resolve against
    # the working directory, so launching from elsewhere would silently open a
    # different (empty) database and look like data loss.
    #
    # Deliberately NOT AUTO_SERVER=TRUE. That flag makes H2 open a TCP listener on
    # ALL interfaces so other processes can share the file — and the credentials
    # beside it are sa with an empty password, so anyone on the same network could
    # read the database directly, going around the entire auth layer. Binding
    # Tomcat to 127.0.0.1 does not constrain it. To inspect the database, stop the
    # app first and open the file directly.
    url: jdbc:h2:file:${user.home}/.savingbuddy/db/savingbuddy;MODE=PostgreSQL
    username: sa
    password: ""

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that it matches the
      # entities and refuses to start if it does not — it never rewrites it.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  # Local-only app: bind to loopback so the API is not served to the network.
  address: 127.0.0.1
  servlet:
    session:
      # Idle timeout. Previously an inherited 30-minute default; stated so it is
      # a decision rather than a coincidence.
      timeout: 12h
      cookie:
        http-only: true
        # Lax, not Strict: the SPA is same-origin so Strict costs nothing
        # functionally, but Lax keeps a link from an email landing signed-in.
        # CSRF tokens carry the cross-site defence either way.
        same-site: lax
        # Off by default because the local app is plain HTTP on loopback. A
        # deployment MUST turn this on — see the postgres profile below.
        secure: ${SECURE_COOKIES:false}

savingbuddy:
  # Both cookies read this one value so they can never disagree: a Secure session
  # cookie beside a non-Secure CSRF cookie leaks the token over plain HTTP.
  secure-cookies: ${SECURE_COOKIES:false}
  registration:
    # open   — anyone may create an account. Safe here and only here, because
    #          this profile binds 127.0.0.1: there is no "anyone who finds the URL".
    # code   — a shared signup code is required.
    # closed — no new accounts.
    # An ABSENT mode means closed, not open. An unset gate must never mean an open door.
    mode: ${REGISTRATION_MODE:open}
    # Never write a literal here — the deployment supplies REGISTRATION_CODE.
    code: ${REGISTRATION_CODE:}
  login-rate-limit:
    # A self-healing window, not a lockout: an account must never be disableable
    # by someone who merely knows its email address.
    window: 15m
    ip-max-failures: 20
    email-max-failures: 5
  backup:
    # snapshot = the app takes its own H2 file snapshots (local default).
    # none     = the app takes no backups, and that is a deliberate choice.
    # A `snapshot` setting against a non-H2 database fails startup rather than
    # logging a warning nobody reads — believing you have backups when you do
    # not is worse than knowing you have none.
    mode: snapshot
    # Snapshots kept in ~/.savingbuddy/backups, oldest pruned beyond this.
    keep: 7

---
# Deployment against PostgreSQL: --spring.profiles.active=postgres
spring:
  config:
    activate:
      on-profile: postgres
  flyway:
    # The app owns its own schema and never touches `public`.
    #
    # Supabase (and any hosted Postgres) puts things in `public` — extensions,
    # helper functions, whatever a dashboard or quickstart created. Flyway
    # refuses to initialise a non-empty schema, so sharing `public` makes the
    # first deploy depend on that schema happening to be empty. It creates this
    # schema itself if missing, so nothing has to be prepared by hand.
    schemas: ${DATABASE_SCHEMA:savingbuddy}
    default-schema: ${DATABASE_SCHEMA:savingbuddy}
  datasource:
    # No defaults, deliberately. A localhost fallback means a misconfigured
    # deployment starts against the wrong database — or an empty one — instead of
    # failing. Spring cannot resolve these placeholders when the variables are
    # unset, so startup aborts naming the missing key.
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Free-tier Postgres has a small connection budget and the app is one small
      # instance; a large idle pool wastes it. Supabase Nano allows 60 direct.
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}
server:
  # The platform assigns the port. Spring does NOT read a bare PORT variable —
  # its relaxed binding maps SERVER_PORT, not PORT — so this indirection is
  # required, not decorative. Render defaults PORT to 10000.
  port: ${PORT:8080}
  # A container or load balancer needs a reachable bind, and Render fails the
  # deploy outright if it cannot detect a port bound on 0.0.0.0.
  address: ${SERVER_ADDRESS:0.0.0.0}
  # Behind a proxy, getRemoteAddr() is the proxy's address, so every user shares
  # one rate-limit bucket. Only trust these headers when a proxy you control
  # actually sets them.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  servlet:
    session:
      cookie:
        secure: ${SECURE_COOKIES:true}
savingbuddy:
  # A deployment is reachable over a network, so cookies must be HTTPS-only.
  # Overridable for a deployment terminating TLS elsewhere, but the default is safe.
  secure-cookies: ${SECURE_COOKIES:true}
  registration:
    # The profile that makes the app reachable is the profile that closes
    # registration. Requires REGISTRATION_CODE, or the app refuses to start.
    mode: ${REGISTRATION_MODE:code}
  backup:
    # Durability belongs to the platform here (managed snapshots, pg_dump, WAL).
    # Stated explicitly so nothing silently assumes the app is covering it.
    mode: none
