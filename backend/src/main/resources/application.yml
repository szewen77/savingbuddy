spring:
  application:
    name: savingbuddy-api

  datasource:
    # Absolute path under the user's home. A relative path would resolve against
    # the working directory, so launching from elsewhere would silently open a
    # different (empty) database and look like data loss.
    #
    # Deliberately NOT AUTO_SERVER=TRUE. That flag makes H2 open a TCP listener on
    # ALL interfaces so other processes can share the file — and the credentials
    # beside it are sa with an empty password, so anyone on the same network could
    # read the database directly, going around the entire auth layer. Binding
    # Tomcat to 127.0.0.1 does not constrain it. To inspect the database, stop the
    # app first and open the file directly.
    url: jdbc:h2:file:${user.home}/.savingbuddy/db/savingbuddy;MODE=PostgreSQL
    username: sa
    password: ""

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that it matches the
      # entities and refuses to start if it does not — it never rewrites it.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  # Local-only app: bind to loopback so the API is not served to the network.
  address: 127.0.0.1
  servlet:
    session:
      # Idle timeout. Previously an inherited 30-minute default; stated so it is
      # a decision rather than a coincidence.
      timeout: 12h
      cookie:
        http-only: true
        # Lax, not Strict: the SPA is same-origin so Strict costs nothing
        # functionally, but Lax keeps a link from an email landing signed-in.
        # CSRF tokens carry the cross-site defence either way.
        same-site: lax
        # Off by default because the local app is plain HTTP on loopback. A
        # deployment MUST turn this on — see the postgres profile below.
        secure: ${SECURE_COOKIES:false}

savingbuddy:
  # Both cookies read this one value so they can never disagree: a Secure session
  # cookie beside a non-Secure CSRF cookie leaks the token over plain HTTP.
  secure-cookies: ${SECURE_COOKIES:false}
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  backup:
    # snapshot = the app takes its own H2 file snapshots (local default).
    # none     = the app takes no backups, and that is a deliberate choice.
    # A `snapshot` setting against a non-H2 database fails startup rather than
    # logging a warning nobody reads — believing you have backups when you do
    # not is worse than knowing you have none.
    mode: snapshot
    # Snapshots kept in ~/.savingbuddy/backups, oldest pruned beyond this.
    keep: 7

---
# Deployment against PostgreSQL: --spring.profiles.active=postgres
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/savingbuddy}
    username: ${DATABASE_USERNAME:savingbuddy}
    password: ${DATABASE_PASSWORD:}
server:
  # A container or load balancer needs a reachable bind. This is only safe
  # behind HTTPS and a trusted network boundary — see the README.
  address: 0.0.0.0
  servlet:
    session:
      cookie:
        secure: ${SECURE_COOKIES:true}
savingbuddy:
  # A deployment is reachable over a network, so cookies must be HTTPS-only.
  # Overridable for a deployment terminating TLS elsewhere, but the default is safe.
  secure-cookies: ${SECURE_COOKIES:true}
  backup:
    # Durability belongs to the platform here (managed snapshots, pg_dump, WAL).
    # Stated explicitly so nothing silently assumes the app is covering it.
    mode: none
