name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -DskipFrontend: the frontend job covers the React build, so there is no
      # reason to compile it again here just to run JUnit.
      #
      # This job is the schema guard. Hibernate runs with ddl-auto=validate
      # against the Flyway-built schema, so an entity changed without a matching
      # migration fails here rather than on someone's database.
      - name: Run tests
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress test -DskipFrontend

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Test
        working-directory: frontend
        run: npx vitest run

  package:
    name: Package JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The real shipping artifact: frontend-maven-plugin compiles React into the
      # JAR. This step is what proves `java -jar` would actually serve the app —
      # the wiring between the two halves is exactly what broke silently before.
      - name: Build
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress clean package -DskipTests

      - name: Verify the UI was packaged into the JAR
        working-directory: backend
        run: |
          JAR=$(ls target/*.jar | grep -v original | head -1)
          echo "JAR=$PWD/$JAR" >> "$GITHUB_ENV"
          jar tf "$JAR" \
            | grep -q 'BOOT-INF/classes/static/index.html' \
            || { echo "::error::index.html missing from the JAR — the frontend did not get packaged"; exit 1; }
          echo "UI present in the JAR."

      - name: Smoke test the packaged app
        run: |
          java -jar "$JAR" \
            --spring.profiles.active=demo \
            --spring.datasource.url='jdbc:h2:mem:ci;MODE=PostgreSQL' \
            --savingbuddy.backup.mode=none &
          # Anonymous /api/summary must be 401 once the app is up — auth is on.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/summary || true)
            [ "$code" = "401" ] && break
            sleep 2
          done
          test "$code" = "401" || { echo "::error::expected 401 for anonymous summary, got $code"; exit 1; }

          # Login as the demo user: fetch the CSRF cookie, echo it as a header.
          # Retry, because the seeder (an ApplicationRunner) can still be running
          # when the web server starts accepting requests.
          JAR_COOKIES=$(mktemp)
          for i in $(seq 1 30); do
            curl -s -c "$JAR_COOKIES" -o /dev/null http://localhost:8080/api/auth/me
            TOKEN=$(awk '/XSRF/ {print $7}' "$JAR_COOKIES")
            login=$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR_COOKIES" -c "$JAR_COOKIES" \
              -H "X-XSRF-TOKEN: $TOKEN" -H 'Content-Type: application/json' \
              -d '{"email":"demo@savingbuddy.local","password":"demo12345"}' \
              http://localhost:8080/api/auth/login)
            [ "$login" = "200" ] && break
            sleep 2
          done
          test "$login" = "200" || { echo "::error::demo login failed ($login)"; exit 1; }

          curl -sf -b "$JAR_COOKIES" http://localhost:8080/api/summary > /dev/null \
            || { echo "::error::authenticated /api/summary failed"; exit 1; }
          curl -sf http://localhost:8080/ | grep -qi '<div id="root"' || { echo "::error::UI not served"; exit 1; }
          echo "Auth gate up, demo login works, UI served."

      - uses: actions/upload-artifact@v7
        with:
          name: savingbuddy-jar
          path: backend/target/*.jar

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Render builds this exact Dockerfile. Building it here means a broken
      # image fails on push, not halfway through a deploy.
      - name: Build image
        run: docker build -t savingbuddy:ci .

      - name: Boot it against a throwaway Postgres
        run: |
          docker network create ci-net
          docker run -d --name ci-db --network ci-net \
            -e POSTGRES_PASSWORD=ci -e POSTGRES_USER=ci -e POSTGRES_DB=savingbuddy \
            postgres:17-alpine
          # The postgres image reports ready once against its temporary init
          # server; wait for the second, real one.
          for i in $(seq 1 60); do
            [ "$(docker logs ci-db 2>&1 | grep -c 'ready to accept connections')" -ge 2 ] && break
            sleep 2
          done

          # PORT is set the way Render sets it, to prove the app honours it.
          docker run -d --name ci-app --network ci-net -p 10000:10000 \
            -e PORT=10000 \
            -e SPRING_PROFILES_ACTIVE=postgres \
            -e DATABASE_URL='jdbc:postgresql://ci-db:5432/savingbuddy?currentSchema=savingbuddy' \
            -e DATABASE_USERNAME=ci -e DATABASE_PASSWORD=ci \
            -e REGISTRATION_MODE=code -e REGISTRATION_CODE=a-very-long-signup-code \
            savingbuddy:ci

          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/healthz || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          docker logs ci-app
          test "$code" = "200" || { echo "::error::container did not become healthy on PORT=10000"; exit 1; }

          # The app must own its schema and leave public alone — that is what
          # stops a leftover object in public blocking a deploy.
          docker exec ci-db psql -U ci -d savingbuddy -tAc \
            "select count(*) from information_schema.tables where table_schema='savingbuddy'" \
            | grep -qE '^\s*1[0-9]' || { echo "::error::tables were not created in the savingbuddy schema"; exit 1; }
          docker exec ci-db psql -U ci -d savingbuddy -tAc \
            "select count(*) from information_schema.tables where table_schema='public'" \
            | grep -qE '^\s*0' || { echo "::error::the app wrote into public"; exit 1; }
          echo "Schema isolation holds: tables in savingbuddy, public untouched." 

          # Registration must be gated, not accidentally open.
          mode=$(curl -s http://localhost:10000/api/auth/registration)
          echo "$mode" | grep -q '"code"' || { echo "::error::registration not gated: $mode"; exit 1; }
          echo "Image boots on PORT, migrates a fresh database, and gates registration."

      - name: Missing database config must fail fast
        run: |
          # A deployment that forgets DATABASE_URL must refuse to start rather
          # than silently falling back to a local database.
          set +e
          out=$(docker run --rm -e SPRING_PROFILES_ACTIVE=postgres savingbuddy:ci 2>&1)
          status=$?
          set -e
          test $status -ne 0 || { echo "::error::app started without database config"; exit 1; }
          echo "$out" | grep -q "DATABASE_URL" || { echo "::error::failure did not name the missing variable"; exit 1; }
          echo "Fails fast and names the missing variable."
