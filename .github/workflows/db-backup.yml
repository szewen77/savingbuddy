name: Encrypted database backup

# SECURITY NOTE FOR A PUBLIC REPOSITORY
#   * Workflow logs on a public repo are world-readable. Never echo the dump,
#     the connection string, or psql output that contains row data.
#   * This workflow deliberately has NO pull_request trigger. Fork PRs can
#     therefore never run it, and secrets are never exposed to fork PRs.
#   * The runner holds only the age PUBLIC keys. It cannot decrypt its own
#     backups. The private keys live offline, on your machine and on paper.

on:
  schedule:
    # 03:17 UTC daily. Deliberately not on the hour: GitHub documents that
    # scheduled events are delayed under load, and load peaks at :00.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: write   # only for the 60-day keepalive commit
  actions: write    # only for pruning old artifacts
  issues: write     # only to raise an issue when a backup fails

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      verifier:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Session pooler URL (IPv4, port 5432). GitHub runners have no IPv6,
      # so the direct db.<ref>.supabase.co host will NOT resolve.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      AGE_RECIPIENT_PRIMARY: ${{ vars.AGE_RECIPIENT_PRIMARY }}
      AGE_RECIPIENT_PAPER: ${{ vars.AGE_RECIPIENT_PAPER }}
      # The app owns the `savingbuddy` schema and never writes to `public`
      # (application.yml flyway.schemas). Dumping `public auth` captured
      # Supabase's own tables and none of this app's — while every check below
      # still passed, because they count tables without naming a schema.
      DUMP_SCHEMAS: savingbuddy
      VERIFY_URL: postgresql://postgres:verify@127.0.0.1:5432/verify
      KEEP_ARTIFACTS: '30'

    steps:
      - uses: actions/checkout@v5

      - name: Install pg_dump 17 and age
        run: |
          set -euo pipefail
          # ubuntu-latest (Ubuntu 24.04) ships PostgreSQL 16 client tools.
          # pg_dump refuses to dump from a server newer than its own major
          # version, and Supabase now defaults to Postgres 17, so 16 is fatal.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${VERSION_CODENAME}-pgdg
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age
          pg_dump --version
          age --version

      - name: Check recipients are configured
        run: |
          set -euo pipefail
          if [ -z "${AGE_RECIPIENT_PRIMARY:-}" ]; then
            echo "::error::AGE_RECIPIENT_PRIMARY repository variable is not set."
            exit 1
          fi
          # The paper key is optional but strongly recommended: it is the only
          # thing standing between a lost laptop and permanently unreadable
          # backups. age can encrypt to several recipients at once.
          if [ -z "${AGE_RECIPIENT_PAPER:-}" ]; then
            echo "::warning::No paper backup recipient. Losing the primary key means losing every backup."
          fi

      - name: Dump database
        run: |
          set -euo pipefail
          # No `set -x` anywhere: logs are public and the URL contains the password.
          schema_args=()
          for s in $DUMP_SCHEMAS; do schema_args+=(--schema="$s"); done

          pg_dump "$SUPABASE_DB_URL" \
            --format=custom \
            --compress=9 \
            --no-owner \
            --no-privileges \
            --quote-all-identifiers \
            "${schema_args[@]}" \
            --file=backup.dump

          echo "PLAIN_SHA=$(sha256sum backup.dump | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "Dump size: $(stat -c%s backup.dump) bytes"

      - name: Verify the dump actually restores
        run: |
          set -euo pipefail
          # A size>0 check proves nothing. This restores the dump into a real
          # Postgres 17 and fails the run if anything is wrong.
          psql "postgresql://postgres:verify@127.0.0.1:5432/postgres" -q \
            -c "DROP DATABASE IF EXISTS verify;" -c "CREATE DATABASE verify;"

          # The dump contains "CREATE SCHEMA public", which collides with the
          # one every new database already has. Drop it so the restore owns it.
          # Extensions go in "extensions" to match Supabase's layout, because
          # column defaults may reference extensions.uuid_generate_v4().
          psql "$VERIFY_URL" -q -v ON_ERROR_STOP=1 \
            -c 'DROP SCHEMA IF EXISTS public CASCADE;' \
            -c 'CREATE SCHEMA IF NOT EXISTS extensions;' \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp" WITH SCHEMA extensions;' \
            -c 'CREATE EXTENSION IF NOT EXISTS "pgcrypto" WITH SCHEMA extensions;' \
            -c 'CREATE EXTENSION IF NOT EXISTS "citext"   WITH SCHEMA extensions;'

          # Do NOT pipe pg_restore: a pipeline masks its exit status.
          if ! pg_restore --dbname="$VERIFY_URL" \
                --no-owner --no-privileges \
                --exit-on-error --single-transaction \
                backup.dump > restore.log 2>&1; then
            echo "::error::pg_restore failed - this backup is NOT restorable."
            tail -30 restore.log
            exit 1
          fi

          # Structural sanity: at least one table, and the tables hold rows.
          tables=$(psql "$VERIFY_URL" -tAc \
            "SELECT count(*) FROM information_schema.tables
             WHERE table_schema NOT IN ('pg_catalog','information_schema');")
          echo "Restored tables: $tables"
          [ "$tables" -gt 0 ] || { echo "::error::No tables restored."; exit 1; }

          # Exact row counts. pg_stat_user_tables.n_live_tup is 0 until ANALYZE
          # runs, so it would false-fail on a fresh restore.
          rows=$(psql "$VERIFY_URL" -tAc "
            SELECT coalesce(sum(cnt),0) FROM (
              SELECT (xpath('/row/c/text()',
                       query_to_xml(format('SELECT count(*) AS c FROM %I.%I',
                         table_schema, table_name), false, true, '')))[1]::text::bigint AS cnt
              FROM information_schema.tables
              WHERE table_schema NOT IN ('pg_catalog','information_schema')
                AND table_type = 'BASE TABLE') t;")
          echo "Restored rows (exact): $rows"
          [ "$rows" -gt 0 ] || { echo "::error::Restored schema is empty."; exit 1; }

          # Referential integrity: re-check every FK the restore just created.
          # --single-transaction defers these, so this is a real check.
          psql "$VERIFY_URL" -q -v ON_ERROR_STOP=1 -c "
            DO \$\$
            DECLARE r record;
            BEGIN
              FOR r IN SELECT conrelid::regclass AS t, conname AS c
                       FROM pg_constraint WHERE contype='f'
              LOOP
                EXECUTE format('ALTER TABLE %s VALIDATE CONSTRAINT %I', r.t, r.c);
              END LOOP;
            END \$\$;"
          echo "Foreign keys validated."

      - name: Encrypt (runner holds public keys only)
        run: |
          set -euo pipefail
          recipients=(-r "$AGE_RECIPIENT_PRIMARY")
          if [ -n "${AGE_RECIPIENT_PAPER:-}" ]; then
            recipients+=(-r "$AGE_RECIPIENT_PAPER")
          fi

          age "${recipients[@]}" -o "backup.dump.age" backup.dump

          # Pipeline self-test: prove age on this runner encrypts and decrypts
          # correctly, using a throwaway key that never leaves this step.
          age-keygen -o /tmp/selftest.key 2>/tmp/selftest.pub
          pub=$(grep -o 'age1[a-z0-9]*' /tmp/selftest.pub)
          age -r "$pub" -o /tmp/selftest.age backup.dump
          age -d -i /tmp/selftest.key /tmp/selftest.age > /tmp/selftest.out
          cmp -s backup.dump /tmp/selftest.out || {
            echo "::error::age self-test failed - do not trust this artifact."; exit 1; }
          shred -u /tmp/selftest.key /tmp/selftest.age /tmp/selftest.out

          # Shred the plaintext so no later step can leak it.
          shred -u backup.dump

          stamp=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          mv backup.dump.age "savingbuddy-${stamp}.dump.age"
          echo "ARTIFACT_NAME=savingbuddy-${stamp}" >> "$GITHUB_ENV"
          {
            echo "### Backup ${stamp}"
            echo "- plaintext sha256: \`${PLAIN_SHA}\`"
            echo "- ciphertext sha256: \`$(sha256sum savingbuddy-${stamp}.dump.age | cut -d' ' -f1)\`"
            echo "- restore verified against Postgres 17: yes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: '*.dump.age'
          retention-days: 90        # 90 is the hard ceiling on a public repo
          compression-level: 0      # already compressed and encrypted
          if-no-files-found: error

      - name: Prune old backup artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name|startswith("savingbuddy-")) | select(.expired==false) | "\(.created_at) \(.id)"' \
            | sort -r | tail -n "+$((KEEP_ARTIFACTS + 1))" | while read -r _ id; do
              echo "Deleting artifact $id"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
            done

      - name: Keepalive (scheduled workflows are disabled after 60 days idle)
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Days since last commit: $age_days"
          if [ "$age_days" -ge 45 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/last-backup-keepalive
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/last-backup-keepalive
            git commit -m "chore: keepalive so scheduled backup is not disabled"
            # Pushing with GITHUB_TOKEN does not trigger another workflow run,
            # so this cannot recurse.
            git push
          fi

      - name: Report failure loudly
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A silent backup failure is the whole problem. Open an issue so it
          # shows up in notifications rather than only in the Actions tab.
          gh issue create \
            --title "Database backup FAILED $(date -u +%F)" \
            --body "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --label backup-failure || true
