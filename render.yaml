# Render Blueprint. Committed to git — every secret here is `sync: false`, which
# means Render prompts for the value and it is never stored in this file.
#
# NOTE: `plan` defaults to `starter` (billable) when omitted, so `plan: free` is
# written explicitly rather than left to the default.
services:
  - type: web
    name: savingbuddy
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    # Pushing to `branch` above redeploys. This is Render's default behaviour;
    # stated explicitly so it is a decision rather than an inherited one.
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres

      # ---- Database (Supabase) ----
      # Use the SESSION POOLER, not the direct connection: direct connections are
      # IPv6-only on Supabase free, and Render does not support IPv6. The
      # transaction pooler (port 6543) is also wrong here — it does not support
      # prepared statements, which Hibernate relies on, and it breaks Flyway's
      # session-scoped locking.
      #
      # End the URL with ?currentSchema=savingbuddy so Hibernate validates against
      # the app's own schema. Flyway creates that schema; `public` is never
      # touched, so nothing in it can block the first deploy.
      #   jdbc:postgresql://aws-<n>-<region>.pooler.supabase.com:5432/postgres?sslmode=require&currentSchema=savingbuddy
      - key: DATABASE_URL
        sync: false
      # Session pooler usernames are postgres.<project-ref>, not plain postgres.
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false

      # ---- Access control ----
      # The app refuses to start with mode=code and no code, so this cannot be
      # forgotten into an open deployment.
      - key: REGISTRATION_MODE
        value: code
      - key: REGISTRATION_CODE
        sync: false

      # ---- Proxy and cookies ----
      # Render terminates TLS at its load balancer and forwards plain HTTP with
      # X-Forwarded-*. `native` makes Spring honour those, so cookies are marked
      # Secure correctly and the rate limiter sees the real client IP instead of
      # bucketing every user together.
      - key: FORWARD_HEADERS_STRATEGY
        value: native
      - key: SECURE_COOKIES
        value: "true"

      # Render routes to the container; there is no same-host terminator to hide
      # behind, so the app must accept connections on all interfaces.
      - key: SERVER_ADDRESS
        value: 0.0.0.0
